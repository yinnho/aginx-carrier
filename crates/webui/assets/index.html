<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aginx</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <aside id="sidebar">
    <div id="side-head">
      <span id="brand-mark">aginx</span>
      <div id="side-actions">
        <button id="refresh-btn" class="icon-btn" title="刷新">⟳</button>
        <button id="settings-btn" class="icon-btn" title="设置">⚙</button>
      </div>
    </div>
    <div id="side-search"><input id="search-input" type="text" placeholder="搜索" autocomplete="off"></div>
    <div id="contact-list"></div>
    <div id="side-foot"><span class="dot" id="conn-dot"></span><span id="conn-label">本地</span></div>
  </aside>

  <main id="chat-pane">
    <div id="banner" class="hidden">大脑未配置——点击填写 API 地址与 Key</div>

    <div id="chat-empty">
      <div class="hero-mark">🧬</div>
      <p>从左侧选择一个分身开始对话</p>
    </div>

    <div id="chat-active" class="hidden">
      <header id="chat-head">
        <div class="avatar" id="chat-avatar">?</div>
        <div class="chat-title">
          <div id="chat-name">—</div>
          <div id="chat-sub">—</div>
        </div>
        <div id="statusbar"><span id="spinner" class="hidden"></span><span id="status-text"></span></div>
      </header>

      <div id="chat-body"></div>

      <footer id="box-ft">
        <div id="toolbar"><a class="tool">😀</a><a class="tool">✂️</a><a class="tool">📎</a></div>
        <div id="composer-content"><textarea id="msg-input" placeholder=""></textarea></div>
        <div id="composer-action">
          <span id="composer-desc">Enter 发送 · Shift+Enter 换行</span>
          <button id="send-btn" class="btn-send">发送</button>
        </div>
      </footer>
    </div>
  </main>

  <dialog id="settings-dialog">
    <form onsubmit="return false">
      <h3>设置 · 大脑（AginxBrain）</h3>
      <label>API 地址<input id="cfg-base-url" type="text" placeholder="https://…" required></label>
      <label>API Key 环境变量名<input id="cfg-key-env" type="text" placeholder="AGINXBRAIN_API_KEY"></label>
      <label>API Key 值（写入 .env，留空不改）<input id="cfg-key-value" type="password" placeholder="sk-…"></label>
      <label>默认模态<input id="cfg-default-modality" type="text" placeholder="chat"></label>
      <fieldset>
        <legend>模态列表</legend>
        <div id="mod-list"></div>
        <div id="mod-add-row">
          <input id="mod-add-name" type="text" placeholder="名字">
          <input id="mod-add-desc" type="text" placeholder="描述">
          <button id="mod-add-btn" type="button" class="btn-ghost">添加</button>
        </div>
      </fieldset>
      <div class="hint" id="settings-hint"></div>
      <div class="dialog-actions">
        <button type="button" id="settings-cancel" class="btn-ghost">取消</button>
        <button type="button" id="settings-save" class="btn-primary">保存</button>
      </div>
    </form>
  </dialog>

  <script src="/assets/app.js"></script>
</body>
</html>
